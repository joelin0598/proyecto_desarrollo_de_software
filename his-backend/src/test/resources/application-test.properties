# ── BD en memoria H2 para tests de integración ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate recreará el esquema en cada ejecución de tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Deshabilitar pool HikariCP que puede interferir con H2 en memoria
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

# JWT para tests
jwt.secret.
jwt.expiration.hours=24

# Suprimir banner y logs innecesarios en tests
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.his=INFO

